<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tsundoku — Suivi de lecture</title>
<meta name="description" content="Suivez vos romans par auteur : possession, lecture, notes et avis.">
<meta name="theme-color" content="#1E2A38">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="#/" class="brand" aria-label="Accueil Tsundoku">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 3.5C3 3 3.4 2.6 4 2.7l5 .9 5-.9c.6-.1 1 .3 1 .8v12c0 .5-.4.9-1 .8l-5-.9-5 .9c-.6.1-1-.3-1-.8v-12Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M9 3.6v12" stroke="currentColor" stroke-width="1.3"/></svg>
      Tsundoku
    </a>
    <div class="search-wrap">
      <input id="author-search" type="search" placeholder="Rechercher un auteur…" autocomplete="off" aria-label="Rechercher un auteur">
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <a href="#/reglages" class="icon-btn" title="Réglages" aria-label="Réglages">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15a3 3 0 100-6 3 3 0 000 6Z" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13.5a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V19.6a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1.1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H2.4a2 2 0 110-4h.09a1.7 1.7 0 001.55-1.1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H8.5a1.7 1.7 0 001-1.55V2.4a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V8.5a1.7 1.7 0 001.55 1h.09a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1Z" stroke="currentColor" stroke-width="1.3"/></svg>
    </a>
  </div>
</header>

<main id="app" class="app"></main>

<div class="backdrop" id="backdrop"></div>
<aside class="detail" id="detail" aria-hidden="true">
  <div class="detail-top">
    <div class="detail-cover" id="detail-cover"></div>
    <button type="button" class="detail-close" id="detail-close" aria-label="Fermer">✕</button>
  </div>
  <div class="detail-body">
    <p class="d-eyebrow" id="detail-series-label"></p>
    <h2 id="detail-title"></h2>
    <p class="title-original" id="detail-original" hidden></p>
    <p class="d-meta" id="detail-meta"></p>
    <p class="d-meta isbn-row" id="detail-isbn-row" hidden>
      ISBN : <span id="detail-isbn"></span>
      <button type="button" class="link-reset" id="detail-isbn-copy">Copier</button>
    </p>

    <div class="stamp-row" id="detail-stamps">
      <button type="button" class="stamp-btn" data-status="to-read">À lire</button>
      <button type="button" class="stamp-btn" data-status="reading">En cours</button>
      <button type="button" class="stamp-btn" data-status="done">Terminé</button>
    </div>

    <div class="row-line">
      <div class="stars-input" id="detail-stars">
        <button type="button" data-value="1">★</button>
        <button type="button" data-value="2">★</button>
        <button type="button" data-value="3">★</button>
        <button type="button" data-value="4">★</button>
        <button type="button" data-value="5">★</button>
      </div>
      <label class="owned-toggle"><input type="checkbox" id="detail-owned"> Possédé</label>
    </div>

    <div class="d-label-row">
      <p class="d-label">Titre</p>
      <button type="button" class="link-reset" id="detail-title-reset" hidden>Réinitialiser</button>
    </div>
    <input type="text" class="field-text" id="detail-title-field" placeholder="">

    <p class="d-label">Série</p>
    <input type="text" class="field-text" id="detail-series-field" placeholder="ex : La Belgariade">

    <p class="d-label">Résumé</p>
    <p class="synopsis" id="detail-synopsis"></p>

    <p class="d-label">Mon avis</p>
    <textarea class="d-review" id="detail-review" rows="3" placeholder="Notes de lecture…"></textarea>

    <button type="button" class="btn-remove-book" id="detail-remove">Retirer de ma liste</button>
  </div>
</aside>

<template id="tpl-book-card">
  <button type="button" class="card">
    <span class="card-cover">
      <img alt="" loading="lazy">
      <span class="ribbon" hidden></span>
      <span class="stamp"></span>
    </span>
    <span class="card-title"></span>
    <span class="card-meta"></span>
    <span class="card-stars"></span>
  </button>
</template>

<script src="app.js" defer></script>
</body>
</html>
